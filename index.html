<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 명함 만들기</title>

    <!-- 구글 폰트 연결 (Black Han Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <h1>나만의 명함 만들기</h1>
      <p>왼쪽에 입력하면 오른쪽 명함에 반영됩니다 </p>
    </header>

    <main class="container">
      <section class="editor">
        <form action="#">
          <fieldset>
            <legend>기본 정보</legend>
            <label for="input-name">이름</label>
            <input type="text" id="input-name" placeholder="예: 홍길동">

            <label for="input-dept">학과</label>
            <select id="input-dept">
              <option value="">인공지능학과</option>
              <option value="컴퓨터공학과">컴퓨터공학과</option>
              <option value="전자공학과">전자공학과</option>
              <option value="기계공학과">기계공학과</option>
              <option value="화학공학과">화학공학과</option>
            </select>

            <label for="input-role">희망 분야</label>
            <input type="text" id="input-role" placeholder="예: 웹 개발자">

          </fieldset>

          <fieldset>
            <legend>연락처</legend>
            <label for="input-phone">연락처</label>
            <input type="tel" id="input-phone" placeholder="예: 010-1234-5678">

            <label for="input-email">이메일</label>
            <input type="email" id="input-email" placeholder="예: hong@example.com">
          </fieldset>

          <fieldset>
            <legend>한 줄 소개</legend>
            <label for="input-intro">한 줄 소개</label>
            <textarea id="input-intro" rows="3"></textarea>
          </fieldset>
        </form>
      </section>

      <section class="preview">
        <h2>명함 미리보기</h2>
        <div class="card">
          <div class="card-top">
            <p class="card-dept">컴퓨터 공학과 </p>
            <p class="card-name">홍길동</p>
            <p class="card-role">웹 개발자</p>
          </div>

          <p class="card-intro">재미있는 것을 하자</p>

          <ul class="card-contact">
            <li>☎️<span class="card-phone">010-1234-5678</span></li>
            <li>✉️<span class="card-email">hong@example.com</span></li>
          </ul>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <small>&copy; 2026 컴퓨터 공학과 </small>
    </footer>
    <script src="js/script.js"></script>


  </body>
</html>
